name: One-time cluster_analysis export

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Execute uploaded notebook port from original deparas Excel
        run: python src/stage03.py --seed 42
      - name: Check source-derived outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          assets=Path("assets")
          df=pd.read_csv(assets/"cluster_analysis_dataset.csv")
          assert df.shape==(5200,58),df.shape
          assert sorted(df.Cluster.unique()) == list(range(6))
          assert df.IdBranch.nunique() == 5200
          pivot=pd.read_csv(assets/"tables_thesis"/"cluster_pivot.csv")
          assert pivot.iloc[:,1:].to_numpy().sum()==5200
          names=("cluster_labels.csv","cluster_pivot.csv",
                 "table_dispersion_notebook.csv","macro_dispersion_notebook.csv",
                 "cluster_model_notebook.csv","elbow_inertia.csv",
                 "cluster_centroids_scaled.csv")
          for name in names:
              path=assets/"tables_thesis"/name
              assert path.is_file(), name
          images=list((assets/"figures_thesis").glob("*.png"))
          print("Data rows",len(df),"Figures",len(images))
          assert len(images)>=12
          PY
      - name: Commit all generated notebook assets to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cluster_analysis_dataset.csv assets/tables_thesis/ assets/figures_thesis/
          git diff --cached --quiet && exit 0
          git commit -m "data: reproduce cluster_analysis notebook CSV and PNG outputs"
          git push origin HEAD:main
