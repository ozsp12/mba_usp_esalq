name: Publish generated research assets (one-time)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-generated-assets.yml"

permissions:
  contents: write

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce stage01 data generation
        run: python src/stage01.py --seed 42
      - name: Generate EDA tables and PNG figures
        run: python src/stage02.py
      - name: Generate thesis tables and PNG figures from historical Excel
        run: python src/stage03.py --input data/cluster_analysis.xlsx
      - name: Confirm all 79 requested outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          base=Path('assets')
          expected={
              'tables_eda':('.csv',6),
              'figures_eda':('.png',56),
              'tables_thesis':('.csv',11),
              'figures_thesis':('.png',6),
          }
          for folder,(suffix,n) in expected.items():
              found=sorted((base/folder).glob('*'+suffix))
              print(folder,len(found))
              if len(found)!=n:
                  raise SystemExit(f'{folder}: expected {n} output files, got {len(found)}')
          data=pd.read_csv(base/'dataset.csv')
          print('Synthetic dataset:',data.shape)
          if data.shape!=(5200,57):
              raise SystemExit('Unexpected generated dataset shape')
          PY
      - name: Commit the generated CSV and PNG files to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dataset.csv assets/tables_eda assets/figures_eda assets/tables_thesis assets/figures_thesis
          git status --short
          git diff --cached --quiet && { echo "No generated differences"; exit 0; }
          git commit -m "data: commit generated EDA and thesis CSV/PNG assets"
          git push origin HEAD:main
